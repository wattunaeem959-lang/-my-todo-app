<style>
body{font-family:sans-serif;background:#f0f2f5;display:flex;justify-content:center;padding-top:80px}
.card{background:white;width:350px;padding:25px;border-radius:15px;box-shadow:0 10px 25px rgba(0,0,0,0.1)}
.input-box{position:relative}
input{width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid #ddd;box-sizing:border-box}
.eye{position:absolute;right:10px;top:18px;cursor:pointer;user-select:none}
button{width:100%;padding:10px;border:none;background:#6c5ce7;color:white;border-radius:8px;cursor:pointer;margin-top:10px}
a{color:#6c5ce7;text-decoration:none}
</style>
<div class="card">
<h2>Signup</h2>
{% if error %}<p style="color:red">{{error}}</p>{% endif %}
<form method="POST">{% csrf_token %}
<input type="text" name="username" placeholder="Naya Username" required>
<div class="input-box">
<input type="password" id="pass" name="password" placeholder="Naya Password" required>
<span class="eye" onclick="toggle()">👁️</span>
</div>
<button>Create Account</button>
</form>
<p>Pehle se account hai? <a href="/login/">Login karo</a></p>
</div>
<script>
function toggle(){
  let p=document.getElementById('pass');
  p.type = p.type==='password' ? 'text' : 'password';
}
</script>
